<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 250 54" width="250" height="54" fill="none">
  <!-- LittleCare Brand Icon -->
  <g transform="translate(4, 3)">
    <!-- Soft background circle -->
    <circle cx="24" cy="24" r="23" fill="#E8F4FD" stroke="#38B6FF" stroke-width="2"/>
    
    <!-- Stylized Cute Bear with Stethoscope / Heart -->
    <!-- Bear ears -->
    <circle cx="14" cy="13" r="5.5" fill="#38B6FF"/>
    <circle cx="14" cy="13" r="2.8" fill="#FFF3B0"/>
    <circle cx="34" cy="13" r="5.5" fill="#38B6FF"/>
    <circle cx="34" cy="13" r="2.8" fill="#FFF3B0"/>
    
    <!-- Bear head -->
    <circle cx="24" cy="23" r="13.5" fill="#38B6FF"/>
    
    <!-- Snout & Nose -->
    <ellipse cx="24" cy="26" rx="5.5" ry="4" fill="#FFFFFF"/>
    <circle cx="24" cy="24.5" r="1.8" fill="#1E293B"/>
    <path d="M24 26.5v1.8" stroke="#1E293B" stroke-width="1.1" stroke-linecap="round"/>
    
    <!-- Eyes -->
    <circle cx="19.5" cy="21" r="1.5" fill="#FFFFFF"/>
    <circle cx="28.5" cy="21" r="1.5" fill="#FFFFFF"/>
    <circle cx="20" cy="20.8" r="0.8" fill="#1E293B"/>
    <circle cx="29" cy="20.8" r="0.8" fill="#1E293B"/>
    
    <!-- Cheeks -->
    <circle cx="17" cy="25" r="1.4" fill="#FF758F" opacity="0.8"/>
    <circle cx="31" cy="25" r="1.4" fill="#FF758F" opacity="0.8"/>
    
    <!-- Heart badge on bottom right -->
    <path d="M35.5 30 C35.5 27 32.5 25 30 27.5 C27.5 25 24.5 27 24.5 30 C24.5 34 30 38 30 38 C30 38 35.5 34 35.5 30 Z" fill="#FF758F"/>
    
    <!-- Medical cross inside small heart -->
    <path d="M29 30.5h2M30 29.5v2" stroke="#FFFFFF" stroke-width="1.1" stroke-linecap="round"/>
  </g>
  
  <!-- Text: LittleCare -->
  <text x="60" y="29" font-family="'Poppins', -apple-system, sans-serif" font-size="22" font-weight="800" fill="#1E293B" letter-spacing="-0.3">
    Little<tspan fill="#38B6FF">Care</tspan>
  </text>
  
  <!-- Subtitle: Pediatric Clinic & Wellness -->
  <text x="61" y="42" font-family="'Nunito', -apple-system, sans-serif" font-size="8.5" font-weight="700" fill="#2EC4B6" letter-spacing="0.6">
    PEDIATRIC CLINIC &amp; WELLNESS
  </text>
  
  <!-- Gentle Sparkle decoration -->
  <path d="M182 14 L184 18 L188 20 L184 22 L182 26 L180 22 L176 20 L180 18 Z" fill="#FFE494"/>
</svg>
