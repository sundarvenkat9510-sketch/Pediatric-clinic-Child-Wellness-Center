<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 265 60" width="265" height="60" fill="none">
  <!-- LittleCare Brand Icon (Full Color Bear exactly as Image 1) -->
  <g transform="translate(5, 5)">
    <!-- Soft background circle -->
    <circle cx="25" cy="25" r="24" fill="#E8F4FD" stroke="#38B6FF" stroke-width="2"/>
    
    <!-- Stylized Cute Bear with Stethoscope / Heart -->
    <!-- Bear ears -->
    <circle cx="15" cy="14" r="6" fill="#38B6FF"/>
    <circle cx="15" cy="14" r="3" fill="#FFF3B0"/>
    <circle cx="35" cy="14" r="6" fill="#38B6FF"/>
    <circle cx="35" cy="14" r="3" fill="#FFF3B0"/>
    
    <!-- Bear head -->
    <circle cx="25" cy="24" r="14" fill="#38B6FF"/>
    
    <!-- Snout & Nose -->
    <ellipse cx="25" cy="27" rx="6" ry="4.5" fill="#FFFFFF"/>
    <circle cx="25" cy="25.5" r="2" fill="#1E293B"/>
    <path d="M25 27.5v2" stroke="#1E293B" stroke-width="1.2" stroke-linecap="round"/>
    
    <!-- Eyes -->
    <circle cx="20.5" cy="22" r="1.6" fill="#FFFFFF"/>
    <circle cx="29.5" cy="22" r="1.6" fill="#FFFFFF"/>
    <circle cx="21" cy="21.8" r="0.8" fill="#1E293B"/>
    <circle cx="30" cy="21.8" r="0.8" fill="#1E293B"/>
    
    <!-- Cheeks -->
    <circle cx="18" cy="26" r="1.5" fill="#FF758F" opacity="0.8"/>
    <circle cx="32" cy="26" r="1.5" fill="#FF758F" opacity="0.8"/>
    
    <!-- Heart badge on bottom right -->
    <path d="M37 31 C37 28 34 26 31.5 28.5 C29 26 26 28 26 31 C26 35 31.5 39 31.5 39 C31.5 39 37 35 37 31 Z" fill="#FF758F"/>
    
    <!-- Medical cross inside small heart -->
    <path d="M30.5 31.5h2M31.5 30.5v2" stroke="#FFFFFF" stroke-width="1.2" stroke-linecap="round"/>
  </g>
  
  <!-- Text: Little (White for dark background) + Care (Sky Blue) -->
  <text x="64" y="32" font-family="'Poppins', sans-serif" font-size="24" font-weight="800" fill="#FFFFFF" letter-spacing="-0.5">
    Little<tspan fill="#38B6FF">Care</tspan>
  </text>
  
  <!-- Subtitle: Pediatric Clinic & Wellness in bright mint green -->
  <text x="65" y="46" font-family="'Nunito', sans-serif" font-size="9.5" font-weight="700" fill="#2EC4B6" letter-spacing="0.8">
    PEDIATRIC CLINIC &amp; WELLNESS
  </text>
  
  <!-- Gentle Sparkle decoration -->
  <path d="M195 16 L197 20 L201 22 L197 24 L195 28 L193 24 L189 22 L193 20 Z" fill="#FFE494"/>
</svg>
